<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE_EN}} · 双语</title>
<style>
  :root { color-scheme: light; }
  body {
    max-width: 760px; margin: 40px auto; padding: 0 20px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", Helvetica, "Hiragino Sans GB", Arial, sans-serif;
    color: #1a1a1a; background: #fafafa; line-height: 1.65;
  }
  header { border-bottom: 1px solid #e5e5e5; padding-bottom: 24px; margin-bottom: 32px; }
  h1.title { font-size: 30px; margin: 0 0 8px; line-height: 1.3; }
  h1.title .zh { display:block; font-size:22px; color:#555; font-weight:600; margin-top:6px; }
  .meta { color: #666; font-size: 14px; }
  h2 { font-size: 22px; margin: 36px 0 10px; border-left: 4px solid #d97757; padding-left: 12px; }
  h2 .zh { display:block; font-size:17px; color:#555; margin-top:2px; }
  h3 { font-size: 18px; margin: 28px 0 8px; color:#333; }
  h3 .zh { display:block; font-size:15px; color:#666; font-weight:600; margin-top:2px; }
  p.en { margin: 14px 0 4px; color: #222; }
  p.zh {
    margin: 0 0 18px; padding: 8px 12px;
    background: #fff; border-left: 3px solid #1d9bf0; border-radius: 3px;
    color: #0f1419; font-size: 15.5px;
  }
  ul.en { margin: 8px 0 4px 22px; }
  ul.zh {
    margin: 0 0 18px; padding: 8px 12px 8px 34px;
    background: #fff; border-left: 3px solid #1d9bf0; border-radius: 3px;
    font-size: 15.5px;
  }
  .prompt-en { font-style: italic; color: #444; background: #f0efe9; padding: 10px 14px; border-radius: 4px; margin: 10px 0 4px; }
  .prompt-zh { padding: 10px 14px; background: #eef7ff; border-left: 3px solid #1d9bf0; border-radius: 4px; margin: 0 0 18px; }
  em, i { color: #b4531a; font-style: italic; }
  strong { color: #000; }
  code { background: #eee; padding: 1px 6px; border-radius: 3px; font-size: 90%; }
  pre { background: #f4f4f4; padding: 12px 14px; border-radius: 4px; overflow-x: auto; }
  pre code { background: transparent; padding: 0; }
  a { color: #1d9bf0; text-decoration: none; }
  a:hover { text-decoration: underline; }
  blockquote { border-left: 3px solid #ccc; margin: 12px 0; padding: 4px 14px; color: #555; }
  img { max-width: 100%; height: auto; display: block; margin: 16px 0; }
  .note { font-size:12px; color:#999; margin-top:60px; text-align:center; }
</style>
</head>
<body>

<header>
  <h1 class="title">
    {{TITLE_EN}}
    <span class="zh">{{TITLE_ZH}}</span>
  </h1>
  <div class="meta">作者：{{AUTHOR}} · 原文：<a href="{{SOURCE_URL}}">{{SOURCE_URL}}</a> · 中英双语对照 · 译文供个人阅读参考</div>
</header>

{{BODY}}

<p class="note">中译供个人阅读参考，如与原文有出入以原文为准。</p>

</body>
</html>
